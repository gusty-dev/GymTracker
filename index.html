<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100d18">
  <title>GymTracker</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="app">
    <header><div><p class="eyebrow">ТРЕНИРОВКИ</p><h1>GymTracker</h1></div><span class="mark">G</span></header>
    <section class="intro"><p class="eyebrow">ТВОЙ ПРОГРЕСС</p><h2>Сильнее с<br>каждой тренировкой.</h2><p class="muted">Записывай подходы и возвращайся к результатам.</p></section>
    <section class="section-head"><div><h2>История</h2><p class="muted">Твои последние тренировки</p></div><span id="count" class="count">0</span></section>
    <div id="history" class="history"></div>
    <button id="open-form" class="primary">＋ &nbsp; Новая тренировка</button>
    <p id="status" class="status" role="status"></p>
  </main>

  <dialog id="workout-dialog">
    <form id="workout-form">
      <div class="dialog-head"><div><p class="eyebrow">ЗАПИСЬ</p><h2>Новая тренировка</h2></div><button type="button" id="close-form" class="close" aria-label="Закрыть">×</button></div>
      <label class="field-label" for="workout-date">Дата</label><input id="workout-date" type="date" required>
      <div id="exercises"></div>
      <button type="button" id="add-exercise" class="secondary">＋ Добавить упражнение</button>
      <button type="submit" class="primary save">Сохранить тренировку</button>
    </form>
  </dialog>
  <template id="exercise-template">
    <article class="exercise-card">
      <div class="exercise-top"><label class="field-label">Упражнение<input class="exercise-name" maxlength="100" placeholder="Например, жим лёжа" required></label><button type="button" class="remove-exercise" aria-label="Удалить упражнение">×</button></div>
      <div class="anatomy" aria-live="polite"><div class="anatomy-copy"><span class="anatomy-kicker">РАБОТАЮЩИЕ МЫШЦЫ</span><strong class="anatomy-title">Выбери упражнение</strong><span class="anatomy-hint">Начни вводить название</span></div><div class="body-map">
        <svg class="body-figure" viewBox="0 0 180 270" role="img" aria-label="Схема мышц спереди"><g class="bones"><path d="M90 37V145M90 58L51 65 36 111M90 58L129 65 144 111M90 145L68 211 63 258M90 145L112 211 117 258"/><path d="M75 65L90 73 105 65M78 93L90 99 102 93M82 119L90 123 98 119M51 65L63 82M129 65L117 82M68 211L79 221M112 211L101 221"/></g><g class="muscles"><path data-muscle="chest" d="M58 68Q72 61 87 72L85 96Q69 99 57 87Z M93 72Q108 61 122 68L123 87Q111 99 95 96Z"/><path data-muscle="shoulders" d="M56 65Q45 62 43 76L53 87 61 78Z M124 65Q135 62 137 76L127 87 119 78Z"/><path data-muscle="biceps" d="M48 83Q40 91 42 106L50 109 56 88Z M132 83Q140 91 138 106L130 109 124 88Z"/><path data-muscle="abs" d="M82 99L98 99 102 135 90 141 78 135Z"/><path data-muscle="quads" d="M69 147Q80 143 87 151L80 199 67 207 61 190Z M93 151Q100 143 111 147L119 190 113 207 100 199Z"/><path data-muscle="calves" d="M66 211L79 215 75 247 65 253 61 241Z M101 215L114 211 119 241 115 253 105 247Z"/></g></svg>
        <svg class="body-figure back" viewBox="0 0 180 270" role="img" aria-label="Схема мышц сзади"><g class="bones"><path d="M90 37V145M90 58L51 65 36 111M90 58L129 65 144 111M90 145L68 211 63 258M90 145L112 211 117 258"/><path d="M75 65L90 73 105 65M78 93L90 99 102 93M82 119L90 123 98 119M51 65L63 82M129 65L117 82M68 211L79 221M112 211L101 221"/></g><g class="muscles"><path data-muscle="upperback" d="M76 66L90 73 104 66 119 80 109 102 90 110 71 102 61 80Z"/><path data-muscle="lats" d="M67 83L78 91 84 120 72 133 62 111Z M113 83L102 91 96 120 108 133 118 111Z"/><path data-muscle="triceps" d="M48 82Q39 90 42 106L49 111 56 88Z M132 82Q141 90 138 106L131 111 124 88Z"/><path data-muscle="glutes" d="M72 135Q90 128 108 135L111 151Q101 160 90 156 79 160 69 151Z"/><path data-muscle="hamstrings" d="M69 157L86 158 79 201 67 207 61 187Z M94 158L111 157 119 187 113 207 101 201Z"/><path data-muscle="calves" d="M66 211L79 215 75 247 65 253 61 241Z M101 215L114 211 119 241 115 253 105 247Z"/></g></svg></div><div class="muscle-legend"><i></i> Основная нагрузка</div></div>
      <div class="sets-head"><span>Подходы</span><span>Повторы</span><span>Вес, кг</span><span></span></div>
      <div class="sets"></div><button type="button" class="add-set">＋ Подход</button>
    </article>
  </template>
  <script src="/static/app.js"></script>
</body>
</html>
