<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f8">
  <title>GymTracker</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="app">
    <header><div><p class="eyebrow">ТРЕНИРОВКИ</p><h1>GymTracker</h1></div><span class="mark">G</span></header>
    <section class="intro"><p class="eyebrow">ТВОЙ ПРОГРЕСС</p><h2>Сильнее с<br>каждой тренировкой.</h2><p class="muted">Записывай подходы и возвращайся к результатам.</p></section>
    <section class="section-head"><div><h2>История</h2><p class="muted">Твои последние тренировки</p></div><span id="count" class="count">0</span></section>
    <div id="history" class="history"></div>
    <button id="open-form" class="primary">＋ &nbsp; Новая тренировка</button>
    <p id="status" class="status" role="status"></p>
  </main>

  <dialog id="workout-dialog">
    <form id="workout-form">
      <div class="dialog-head"><div><p class="eyebrow">ЗАПИСЬ</p><h2>Новая тренировка</h2></div><button type="button" id="close-form" class="close" aria-label="Закрыть">×</button></div>
      <label class="field-label" for="workout-date">Дата</label><input id="workout-date" type="date" required>
      <div id="exercises"></div>
      <button type="button" id="add-exercise" class="secondary">＋ Добавить упражнение</button>
      <button type="submit" class="primary save">Сохранить тренировку</button>
    </form>
  </dialog>
  <template id="exercise-template">
    <article class="exercise-card">
      <div class="exercise-top"><label class="field-label">Упражнение<input class="exercise-name" maxlength="100" placeholder="Например, жим лёжа" required></label><button type="button" class="remove-exercise" aria-label="Удалить упражнение">×</button></div>
      <div class="sets-head"><span>Подходы</span><span>Повторы</span><span>Вес, кг</span><span></span></div>
      <div class="sets"></div><button type="button" class="add-set">＋ Подход</button>
    </article>
  </template>
  <script src="/static/app.js"></script>
</body>
</html>
